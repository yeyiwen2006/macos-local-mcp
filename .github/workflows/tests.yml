name: tests

on:
  push:
  pull_request:

jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install portable dependencies
        run: python -m pip install -e ".[test]"
      - name: Syntax
        run: python -m compileall -q src tests
      - name: Portable safety tests
        run: python -m pytest -q

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Native imports
        run: python -c "import AppKit, Quartz, ApplicationServices; from macos_local_mcp.desktop import _NativeBackend; _NativeBackend(); print('PyObjC native imports OK')"
      - name: Shell syntax
        run: bash -n Setup.command Configure.command Permissions.command Start.command Stop.command Pause.command Resume.command Check.command Control.command
      - name: Test
        run: python -m pytest -q
