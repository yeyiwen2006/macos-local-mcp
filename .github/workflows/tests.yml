name: tests

on:
  push:
  pull_request:

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install portable dependencies
        run: python -m pip install -e ".[test]"
      - name: Syntax
        run: python -m compileall -q src tests
      - name: Portable safety tests
        run: python -m pytest -q

  macos:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Native imports
        run: python -c "import AppKit, Quartz, ApplicationServices; from macos_local_mcp.desktop import _NativeBackend; _NativeBackend(); print('PyObjC native imports OK')"
      - name: Native API surface
        run: python -c "import Quartz, ApplicationServices as AX; required_q=['CGWindowListCopyWindowInfo','CGWindowListCreateImage','CGEventCreateKeyboardEvent','CGEventSetFlags','CGEventSourceKeyState','CGEventSourceButtonState','CGEventKeyboardSetUnicodeString']; required_ax=['AXUIElementCopyAttributeValue','AXUIElementCreateApplication','AXUIElementPerformAction']; assert all(hasattr(Quartz,n) for n in required_q); assert all(hasattr(AX,n) for n in required_ax); print('Native API surface OK')"
      - name: Permission status smoke
        run: python -c "from macos_local_mcp.permissions import permission_status; print(permission_status())"
      - name: Shell syntax
        run: |
          for script in ./*.command; do
            bash -n "$script"
          done
      - name: Test
        run: python -m pytest -q
